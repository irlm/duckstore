# Services on one Docker network:
#
#   postgres   the store's OLTP database                 127.0.0.1:55432
#   analytics  DuckDB warehouse + ETL + analytics API    127.0.0.1:5090
#   web        Blazor UI: CRUD, reports, Compare page    127.0.0.1:5085
#   toxiproxy  a proxy that can add network delay, for the Compare page (API on 127.0.0.1:8474)
#
# `make docker-up` starts them; `make docker-seed SCALE=5` loads data and builds
# the warehouse. `docker compose up -d postgres` alone is enough for the Go app.
#
# All three share this machine's CPU and memory: the numbers on the Compare page
# show two engines on the same hardware, not two separate servers.
name: duckstore

services:
  postgres:
    # The official postgres:18 plus the pg_duckdb extension (docker/postgres.Dockerfile).
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: duckstore-postgres
    container_name: duckstore-postgres
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    # Port 55432 on the host so it does not clash with a local Postgres on 5432.
    ports:
      - "127.0.0.1:55432:5432"
    # Parallel query workers share memory through /dev/shm.
    shm_size: 4g
    # Tuned for analytics on a 16-thread laptop with 28 GB RAM that also runs a
    # desktop, so the comparison with DuckDB is fair: a large cache and up to 8
    # parallel workers per query. Memory settings leave room for DuckDB (6 GB).
    command:
      - postgres
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=10GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=16GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_worker_processes=24
      - -c
      - max_parallel_workers=16
      - -c
      - max_parallel_workers_per_gather=8
      - -c
      - max_parallel_maintenance_workers=4
      # pg_duckdb must be loaded when the server starts. It does nothing to normal queries;
      # it runs a query in DuckDB only when asked (see analytics/postgres-pg_duckdb.sql).
      - -c
      - shared_preload_libraries=pg_duckdb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Loads fake data. Not started by `up`: run `make docker-seed SCALE=5`.
  seed:
    build:
      context: .
      dockerfile: docker/seed.Dockerfile
    image: duckstore-seed
    profiles: [tools]
    environment:
      DUCKSTORE_PG_URL: postgres://store:store@postgres:5432/store?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    image: duckstore-analytics
    container_name: duckstore-analytics
    environment:
      # Host=postgres: containers find each other by service name. GSS (Kerberos)
      # encryption is off because the image has no Kerberos library to load.
      ConnectionStrings__Store: Host=postgres;Port=5432;Database=store;Username=store;Password=store;GSS Encryption Mode=Disable
      # SQL Server as the load target of `mssql-load` (only useful with the mssql profile up).
      ConnectionStrings__SqlServer: Server=mssql,1433;Database=duckstore;User Id=sa;Password=${MSSQL_SA_PASSWORD:-};TrustServerCertificate=True;Encrypt=False
      # Postgres runs on the same machine, so DuckDB must not take 80% of the RAM.
      Warehouse__MemoryLimit: 6GB
      # Build the warehouse when the volume has no file yet (needs seeded data).
      Etl__RunOnStartup: "true"
    ports:
      - "127.0.0.1:5090:8080"
    volumes:
      - warehouse:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: duckstore-web
    container_name: duckstore-web
    environment:
      ConnectionStrings__Store: Host=postgres;Port=5432;Database=store;Username=store;Password=store;GSS Encryption Mode=Disable
      # Container to container: the service name is the host name.
      Analytics__BaseUrl: http://analytics:8080/
      # The same two services through Toxiproxy, for the Compare page's "Network" setting.
      Network__ToxiproxyUrl: http://toxiproxy:8474/
      ConnectionStrings__StoreViaProxy: Host=toxiproxy;Port=15432;Database=store;Username=store;Password=store;GSS Encryption Mode=Disable
      Analytics__BaseUrlViaProxy: http://toxiproxy:18080/
    ports:
      - "127.0.0.1:5085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_started
      toxiproxy:
        condition: service_started

  # SQL Server, the engine most teams already have: the benchmark's third engine, with a
  # clustered columnstore on the star schema. Started only when asked for, because it wants
  # its own memory next to Postgres (3 GB) and DuckDB (6 GB):
  #   make docker-mssql       start it and wait
  #   make docker-mssql-load  copy the warehouse into it
  # MSSQL_SA_PASSWORD comes from .env (git-ignored); `make docker-mssql` writes one if there
  # is none. Developer edition is free and has every Enterprise feature.
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: duckstore-mssql
    profiles: [mssql]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      MSSQL_PID: Developer
      # Leave room for Postgres, DuckDB and the desktop on a 28 GB laptop.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-4096}
      MSSQL_AGENT_ENABLED: "false"
      TZ: UTC
    # Port 51433 on the host so it does not clash with a local SQL Server on 1433.
    ports:
      - "127.0.0.1:51433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Forwards TCP connections and can slow them down on purpose (Shopify's Toxiproxy).
  # The web app creates two proxies through its API and sets their delay:
  #   toxiproxy:15432 -> postgres:5432      toxiproxy:18080 -> analytics:8080
  # Try it by hand: curl http://127.0.0.1:8474/proxies
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: duckstore-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"

volumes:
  pgdata:
  warehouse:
  mssqldata:
